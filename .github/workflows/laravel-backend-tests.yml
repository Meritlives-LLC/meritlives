name: Laravel backend tests

on:
  pull_request:
    branches:
      - feature/featured-stories-hero
    paths:
      - "backend/**"
      - ".github/workflows/laravel-backend-tests.yml"
  push:
    branches:
      - feature/editorial-ai-studio
    paths:
      - "backend/**"
      - ".github/workflows/laravel-backend-tests.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          # The committed lockfile currently resolves Symfony 8.1, which requires PHP 8.4.1+.
          php-version: "8.4"
          extensions: bcmath, ctype, curl, dom, fileinfo, intl, mbstring, pdo_sqlite, sqlite3, tokenizer, xml
          coverage: none
          tools: composer:v2

      - name: Validate Composer configuration
        run: composer validate --no-check-publish

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare test environment
        run: |
          cp .env.example .env
          php artisan key:generate --force
          mkdir -p storage/framework/cache storage/framework/sessions storage/framework/views bootstrap/cache

      - name: Run test suite
        run: php artisan test
