# Example CI workflow. Adapt paths and deployment secrets to the hosting platform.
name: MERITLIVES CI

on:
  push:
    branches: [main, feature/featured-stories-hero]
  pull_request:
    branches: [main, feature/featured-stories-hero]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: mbstring, pdo_mysql, pdo_sqlite, sqlite3, intl
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: php artisan test

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
